<div class="trend-section">
  <div class="trend-header">
    <h2 class="trend-title">Expenses by Category</h2>

    <div class="filter-group">
      <label for="cat-select" class="sr-only">Category</label>
      <select
        id="cat-select"
        #categorySelect
        class="category-select"
        (change)="onCategoryChange(categorySelect.value)"
      >
        @for (c of categories(); track c) {
          <option [value]="c">{{ c | titlecase }}</option>
        }
      </select>
    </div>
  </div>

  <div class="chart-container">
    <app-chart-card title="Last 6 months" chartType="line" [chartData]="categoryTrend()" />
  </div>
</div>
