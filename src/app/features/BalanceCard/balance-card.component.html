<div>
  <div class="px-6 py-4">
    <p class="font-bold text-xl mb-2">{{ title() }}</p>
    <p class="font-bold text-xl mb-2">{{ amount() }}</p>

    <div style="display: flex; align-items: center; width: 100%; height: 2rem; gap: 10px">
      <div>Negative</div>

      <!-- Left Container (Negative) -->
      <div
        style="flex: 1; display: flex; justify-content: flex-end; height: 1rem; background: #f0f0f0"
      >
        <div style="background: red; height: 1rem" [style.width.%]="negativeAmount()"></div>
      </div>

      <!-- Center Marker -->
      <div style="font-weight: bold">0</div>

      <!-- Right Container (Positive) -->
      <div
        style="
          flex: 1;
          display: flex;
          justify-content: flex-start;
          height: 1rem;
          background: #f0f0f0;
        "
      >
        <div style="background: blue; height: 1rem" [style.width.%]="positiveAmount()"></div>
      </div>

      <div>Positive</div>
    </div>
  </div>
</div>
